<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>喵鳐</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="stage">
      <div id="task" class="task" hidden>
        <div class="task-head">
          <span class="task-dot"></span>
          <span id="task-state" class="task-state">opencode</span>
          <span id="task-count" class="task-count"></span>
        </div>
        <div id="task-title" class="task-title" hidden></div>
        <div id="task-detail" class="task-detail" hidden></div>
        <div class="task-bar"><i id="task-fill"></i></div>
      </div>
      <div id="bubble" class="bubble" hidden></div>
      <div id="pet" class="pet">
        <div id="flipper" class="flipper">
          <img id="sprite" alt="喵鳐" draggable="false" />
          <div id="controller" class="controller" hidden aria-hidden="true">
            <svg viewBox="0 0 132 66" role="img">
              <defs>
                <linearGradient id="padBody" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#4b4f63" />
                  <stop offset="1" stop-color="#2b2e3d" />
                </linearGradient>
              </defs>
              <path
                d="M25 10h82c12 0 20 9 21 21l2 15c2 12-12 18-20 9l-9-10H31l-9 10c-8 9-22 3-20-9l2-15c1-12 9-21 21-21z"
                fill="url(#padBody)"
                stroke="#16171a"
                stroke-width="3"
                stroke-linejoin="round"
              />
              <rect x="33" y="24" width="17" height="6" rx="2" fill="#e9eef8" stroke="#16171a" stroke-width="2" />
              <rect x="38" y="19" width="6" height="16" rx="2" fill="#e9eef8" stroke="#16171a" stroke-width="2" />
              <circle cx="92" cy="29" r="6" fill="#ff93bb" stroke="#16171a" stroke-width="2" />
              <circle cx="104" cy="38" r="6" fill="#ffd45f" stroke="#16171a" stroke-width="2" />
              <circle cx="80" cy="38" r="6" fill="#7db9ff" stroke="#16171a" stroke-width="2" />
              <circle cx="66" cy="29" r="3.4" fill="#16171a" />
              <circle cx="66" cy="47" r="3.4" fill="#16171a" />
            </svg>
          </div>
        </div>
        <div id="effects" class="effects" aria-hidden="true"></div>
      </div>
    </div>

    <div id="menu" class="menu" hidden>
      <button class="item" data-action="pet"><span>摸摸头</span></button>
      <button class="item" data-action="feed"><span>喂麻婆豆腐</span></button>
      <button class="item" data-action="sleep"><span id="sleep-label">睡一觉</span></button>
      <button class="item" data-action="walk"><span>去散步</span></button>
      <button class="item" data-action="run"><span>跑一跑</span></button>
      <button class="item" data-action="jump"><span>跳一跳</span></button>
      <button class="item" data-action="skate"><span>玩滑板</span></button>
      <div class="sep"></div>
      <div class="group">
        <span class="group-label">大小</span>
        <div class="chips">
          <button class="chip" data-action="scale-small" data-scale="0.8">小</button>
          <button class="chip" data-action="scale-medium" data-scale="1">中</button>
          <button class="chip" data-action="scale-large" data-scale="1.25">大</button>
        </div>
      </div>
      <button class="item check" data-action="toggle-ontop">
        <span>总在最前</span><span class="mark"></span>
      </button>
      <div class="sep"></div>
      <button class="item" data-action="hide-tray"><span>隐藏到托盘</span></button>
      <button class="item danger" data-action="quit"><span>退出</span></button>
    </div>

    <script type="module" src="renderer.js"></script>
  </body>
</html>
