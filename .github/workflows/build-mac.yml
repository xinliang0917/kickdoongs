name: Build macOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm64
          - x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Package app
        env:
          PET_ARCH: ${{ matrix.arch }}
        run: npm run package

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: jiuwang-macos-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error
