name: Build packages

on:
  workflow_dispatch:
  push:
    branches:
      - huadong
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm64
          - x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package app
        env:
          PET_ARCH: ${{ matrix.arch }}
        run: npm run package

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: huadong-macos-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Exclude workspace from Defender
        shell: pwsh
        run: |
          if (Get-Command Add-MpPreference -ErrorAction SilentlyContinue) {
            Get-MpComputerStatus | Select-Object AMServiceEnabled, RealTimeProtectionEnabled, AntivirusEnabled
            try {
              Add-MpPreference -ExclusionPath "${{ github.workspace }}"
              Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP"
              Add-MpPreference -ExclusionPath "$env:LOCALAPPDATA\electron\Cache"
              Write-Host "Defender exclusions added"
            } catch {
              Write-Warning "Could not add Defender exclusions: $_"
            }
          } else {
            Write-Host "Add-MpPreference is not available"
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package app
        run: npm run package

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: huadong-windows-x64
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download zips
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
