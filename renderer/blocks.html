<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self';">
  <title>搭积木 · 呜旻</title>
  <link rel="stylesheet" href="blocks.css">
</head>
<body>
  <div id="app">
    <div id="card">
      <header id="bar">
        <div class="brand">
          <img id="headIcon" src="../assets/icon.png" alt="">
          <div>
            <div class="title">搭积木</div>
            <div class="subtitle">和呜旻一起，一块一块往上搭</div>
          </div>
        </div>
        <button id="closeBtn" class="close-btn" title="关闭">×</button>
      </header>

      <div id="cheer" class="cheer">姐姐加油，呜旻在下面接着！</div>

      <div id="stage">
        <canvas id="game"></canvas>
        <div id="startPanel" class="panel">
          <div class="panel-title">呜旻把积木摆好啦</div>
          <p>按空格或点击画面，把移动的积木放下去。<br>对得越准，塔就越稳。</p>
          <button id="startBtn" class="primary">开始搭积木</button>
        </div>
        <div id="overPanel" class="panel hidden">
          <div class="panel-title" id="overTitle">塔倒啦……</div>
          <p id="overText">姐姐搭了 0 层。</p>
          <button id="retryBtn" class="primary">再搭一次</button>
        </div>
      </div>

      <div id="foot">
        <div class="stat">本局 <b id="scoreVal">0</b> 层</div>
        <div class="stat">最高 <b id="bestVal">0</b> 层</div>
        <div class="hintline">空格 / 点击 放积木</div>
      </div>
    </div>
  </div>
  <script src="blocks.js"></script>
</body>
</html>
